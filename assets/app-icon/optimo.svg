<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Optimo app icon, concept A (2026-10-14): a white O on the blue tile (same tile as Margin's),
       its left half solid, its right half dotted: "solid you, dotted AI". Above 32 pt. -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="#0A64D6"/>
  <!-- left half: a solid round-capped stroke (the person) -->
  <path d="M 512 262 A 250 250 0 0 0 512 762" fill="none" stroke="#FFFFFF" stroke-width="96" stroke-linecap="round"/>
  <!-- right half: round dots (the AI) -->
  <circle cx="637.0" cy="295.5" r="42" fill="#FFFFFF"/>
  <circle cx="728.5" cy="387.0" r="42" fill="#FFFFFF"/>
  <circle cx="762.0" cy="512.0" r="42" fill="#FFFFFF"/>
  <circle cx="728.5" cy="637.0" r="42" fill="#FFFFFF"/>
  <circle cx="637.0" cy="728.5" r="42" fill="#FFFFFF"/>
</svg>

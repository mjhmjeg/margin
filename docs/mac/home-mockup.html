<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Margin home mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
:root{--accent:#0A64D6;--desk:#ECECEC;--chrome:#F6F6F6;--panel:#FAFAFA;--page:#fff;--line:#E3E3E3;--text:#1D1D1F;--dim:#6E6E73;--faint:#A1A1A6;--hover:#EAEAEA;--sel:#DCDCDC}
.dark{--desk:#1E1E1E;--chrome:#2A2A2A;--panel:#262626;--line:#383838;--text:#F2F2F2;--dim:#A1A1A6;--faint:#6E6E73;--hover:#333;--sel:#3D3D3D;--accent:#3D9BFF}
*{box-sizing:border-box}
body{margin:0;font:13px/1.4 Inter,system-ui,sans-serif;color:var(--text);background:#9a9a9a}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.window{margin:24px auto;width:min(1180px,calc(100% - 32px));height:760px;border-radius:12px;overflow:hidden;display:grid;grid-template-columns:220px 1fr;background:var(--desk);box-shadow:0 20px 60px #0005;border:1px solid #0000004d}
.side{background:var(--panel);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column}
.lights{display:flex;gap:8px;padding:4px 6px 20px}.lights i{width:12px;height:12px;border-radius:50%}
.side h6{margin:16px 8px 6px;font:inherit;color:var(--faint)}
.nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:7px 10px;border-radius:6px;color:var(--text)}
.nav button:hover{background:var(--hover)}.nav button.on{background:var(--sel)}
.nav svg{width:16px;height:16px;stroke:var(--dim);fill:none;stroke-width:1.6}
.main{display:flex;flex-direction:column;min-width:0}
.top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:var(--chrome)}
.search{width:240px;height:28px;border:1px solid #8A8A8A;border-radius:7px;padding:0 10px;display:flex;align-items:center;color:var(--faint);background:var(--page)}
.dark .search{background:#1e1e1e;border-color:#7a7a7a}
.body{flex:1;overflow:auto;padding:28px 28px 40px}
h2{font:inherit;color:var(--dim);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:28px 24px;margin-bottom:40px}
.card{cursor:pointer}
.thumb{aspect-ratio:8.5/11;background:#fff;border-radius:8px;box-shadow:0 0 0 1px #0000001a,0 2px 8px #00000014;padding:16px 14px;overflow:hidden;transition:box-shadow .12s}
.card:hover .thumb{box-shadow:0 0 0 1px #0000001a,0 6px 18px #00000026}
.card.on .thumb{box-shadow:0 0 0 3px var(--accent)}
.card p{margin:10px 2px 0;text-align:center}
.card small{display:block;text-align:center;color:var(--faint);margin-top:2px}
.l{height:4px;border-radius:2px;background:#D6D6DA;margin:6px 0}
.h{height:9px;width:70%;background:#1d1d1f;border-radius:2px;margin-bottom:10px}
.h2{height:6px;width:45%;background:#0A64D6;border-radius:2px;margin:12px 0 6px}
.blank{display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:28px}
.footer{height:56px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 24px;background:var(--chrome)}
.btn{height:28px;padding:0 16px;border-radius:7px;border:1px solid #8A8A8A;background:var(--page)}
.dark .btn{background:#2f2f2f}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.notes{width:min(1180px,calc(100% - 32px));margin:0 auto 40px;color:#fff;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notes button{background:#ffffff26;border:1px solid #ffffff4d;border-radius:6px;padding:5px 10px;color:#fff}
.pane{display:none}.pane.on{display:block}
</style>
</head>
<body>
<div class="window">
  <aside class="side">
    <div class="lights"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></div>
    <div class="nav">
      <button class="on" onclick="go(this,'new')"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M12 10v6M9 13h6"/></svg>New</button>
      <button onclick="go(this,'recent')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Recent</button>
      <button onclick="alert('Opens the macOS Open dialog')"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg>Open…</button>
    </div>
    <h6>Templates</h6>
    <div class="nav">
      <button onclick="go(this,'new')">Basic</button>
      <button onclick="go(this,'new')">Letters</button>
      <button onclick="go(this,'new')">Résumés</button>
      <button onclick="go(this,'new')">Reports</button>
    </div>
  </aside>
  <section class="main">
    <div class="top"><span id="ttl">Choose a template</span><span class="search">Search templates</span></div>
    <div class="body">
      <div class="pane on" id="new">
        <h2>Basic</h2>
        <div class="grid">
          <div class="card on" onclick="pick(this)"><div class="thumb blank">+</div><p>Blank</p></div>
          <div class="card" onclick="pick(this)"><div class="thumb"><div class="h"></div><div class="l"></div><div class="l" style="width:80%"></div><div class="l"></div><div class="h2"></div><div class="l"></div><div class="l" style="width:60%"></div></div><p>Studio handbook</p><small>Sample</small></div>
          <div class="card" onclick="pick(this)"><div class="thumb"><div class="h" style="width:40%;height:7px"></div><div class="l" style="width:50%"></div><div style="height:22px"></div><div class="l" style="width:35%"></div><div class="l"></div><div class="l"></div><div class="l" style="width:70%"></div></div><p>Letter</p></div>
          <div class="card" onclick="pick(this)"><div class="thumb"><div class="h" style="width:55%"></div><div class="l" style="width:70%"></div><div class="h2"></div><div class="l"></div><div class="l" style="width:85%"></div><div class="h2"></div><div class="l"></div></div><p>Résumé</p></div>
          <div class="card" onclick="pick(this)"><div class="thumb"><div class="h" style="width:80%"></div><div class="l"></div><div class="l"></div><div class="h2"></div><div class="l"></div><div class="l"></div><div class="l" style="width:50%"></div></div><p>Report</p></div>
        </div>
      </div>
      <div class="pane" id="recent">
        <h2>Today</h2>
        <div class="grid">
          <div class="card" onclick="pick(this)"><div class="thumb"><div class="h"></div><div class="l"></div><div class="l" style="width:80%"></div><div class="l"></div><div class="h2"></div><div class="l"></div></div><p>The Open Studio Handbook</p><small>Desktop · 14:02</small></div>
        </div>
      </div>
    </div>
    <div class="footer"><button class="btn">Cancel</button><button class="btn primary" id="cta">Create</button></div>
  </section>
</div>
<div class="notes">
  <button onclick="document.body.classList.toggle('dark')">Light / dark</button>
  <span>Click New / Recent in the sidebar. Double-click a card (or Create) opens it.</span>
</div>
<script>
function go(btn,id){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id===id));document.getElementById('ttl').textContent=id==='recent'?'Recent documents':'Choose a template';document.getElementById('cta').textContent=id==='recent'?'Open':'Create'}
function pick(c){c.parentElement.querySelectorAll('.card').forEach(x=>x.classList.remove('on'));c.classList.add('on')}
</script>
</body>
</html>
